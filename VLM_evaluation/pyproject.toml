[build-system]
requires = ["setuptools>=68,<85", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiedai-traversability"
version = "0.1.0"
description = "Whole-image hazard prompt evaluation, SAM3 handoff and deployment profiling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["traversability_*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
