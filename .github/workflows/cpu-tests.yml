name: CPU pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/path_mapping_cpu.txt
            requirements/test.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements/test.txt
      - name: Check shared contracts and adapters without model inference
        run: python -m pytest -q tests
