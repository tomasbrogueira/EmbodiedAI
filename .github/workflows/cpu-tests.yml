name: CPU path-planning checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: path-planning:orchestrator
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: path-planning/requirements.txt
      - name: Install existing CPU and viewer dependencies
        run: python -m pip install -r path-planning/requirements.txt
      - name: Install CPU tensors for reconstruction wrapper tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile native search
        run: g++ -O3 -std=c++17 -ffp-contract=off -shared -fPIC path-planning/corridor_astar_feasible.cpp -o path-planning/corridor_astar_feasible.so
      - name: Test contracts without model inference
        run: DATASET_REPO="$PWD" DATASET_NATIVE_LIBRARY="$PWD/path-planning/corridor_astar_feasible.so" python -B -m unittest discover -s path-planning -v
